<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetworkTester - Monitor Sieci</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Górny pasek nawigacji -->
    <nav class="navbar">
      <div class="logo">NetworkTester</div>
      <div class="nav-links" id="nav-menu">
        <button class="btn-outline" onclick="pokazLogowanie()">
          Logowanie
        </button>
        <button class="btn-outline" onclick="pokazRejestracje()">
          Rejestracja
        </button>
      </div>
    </nav>

    <div class="container">
      <!-- Sekcja Autoryzacji (Logowanie / Rejestracja) -->
      <div id="auth-section" class="card auth-card">
        <h2 id="auth-title">Logowanie</h2>
        <div class="form-group">
          <label>Email / Login:</label>
          <input type="text" id="auth-login" placeholder="Wpisz login" />
        </div>
        <div class="form-group">
          <label>Hasło:</label>
          <input type="password" id="auth-password" placeholder="Wpisz hasło" />
        </div>
        <button class="btn-primary auth-btn" id="auth-submit">Zaloguj</button>
        <p class="auth-switch">
          Nie masz konta?
          <span onclick="pokazRejestracje()">Zarejestruj się</span>
        </p>
      </div>

      <!-- Główny Panel Aplikacji (Domyślnie ukryty) -->
      <div id="dashboard-section" style="display: none">
        <div class="card">
          <h3>Dodaj serwer do monitorowania</h3>
          <div class="add-host-grid">
            <input type="text" id="nazwa" placeholder="Nazwa (np. Brama)" />
            <input type="text" id="adres" placeholder="Adres (np. 8.8.8.8)" />
            <select id="typ">
              <option value="ICMP">Ping (ICMP)</option>
              <option value="HTTP">Strona (HTTP)</option>
              <option value="TCP">Port (TCP)</option>
            </select>
            <button class="btn-primary" onclick="dodajHost()">Dodaj cel</button>
          </div>
        </div>

        <div class="card">
          <h3>Twoje serwery</h3>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Nazwa</th>
                  <th>Adres</th>
                  <th>Typ</th>
                  <th>Status</th>
                  <th>Czas odpowiedzi</th>
                  <th>Akcja</th>
                </tr>
              </thead>
              <tbody>
                <!-- Generowane przez JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      let trybRejestracji = false;

      function pokazLogowanie() {
        trybRejestracji = false;
        document.getElementById("auth-title").innerText = "Logowanie";
        document.getElementById("auth-submit").innerText = "Zaloguj";
        document.querySelector(".auth-switch").innerHTML =
          'Nie masz konta? <span onclick="pokazRejestracje()">Zarejestruj się</span>';
      }

      function pokazRejestracje() {
        trybRejestracji = true;
        document.getElementById("auth-title").innerText = "Rejestracja";
        document.getElementById("auth-submit").innerText = "Załóż konto";
        document.querySelector(".auth-switch").innerHTML =
          'Masz już konto? <span onclick="pokazLogowanie()">Zaloguj się</span>';
      }

      document.getElementById("auth-submit").onclick = function () {
        const loginVal = document.getElementById("auth-login").value.trim();
        const passwordVal = document
          .getElementById("auth-password")
          .value.trim();

        if (!loginVal || !passwordVal) {
          alert("Wypełnij login i hasło!");
          return;
        }

        const endpoint = trybRejestracji ? "/register" : "/login";

        fetch(API_URL + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: loginVal, password: passwordVal }),
        })
          .then(async function (res) {
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data.detail || "Błąd operacji");
            }
            return data;
          })
          .then(function (data) {
            if (trybRejestracji) {
              alert("Rejestracja udana! Teraz możesz się zalogować.");
              pokazLogowanie();
              document.getElementById("auth-password").value = "";
            } else {
              // Sukces logowania - przechodzimy do dashboardu
              document.getElementById("auth-section").style.display = "none";
              document.getElementById("dashboard-section").style.display =
                "block";
              document.getElementById("nav-menu").innerHTML = `
                        <span style="margin-right: 15px; color: var(--text-secondary);">Zalogowano: <b>${data.username}</b></span>
                        <button class="btn-outline" onclick="location.reload()">Wyloguj</button>
                    `;
              pobierzHosty();
            }
          })
          .catch(function (err) {
            alert(err.message);
          });
      };
    </script>
  </body>
</html>
